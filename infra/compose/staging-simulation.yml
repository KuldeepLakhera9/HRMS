version: "3.8"

networks:
  dmz_net:
    ipam:
      driver: default
      config:
        - subnet: 172.28.10.0/24
  app_net:
    ipam:
      driver: default
      config:
        - subnet: 172.28.20.0/24
  data_net:
    ipam:
      driver: default
      config:
        - subnet: 172.28.30.0/24
  backup_net:
    ipam:
      driver: default
      config:
        - subnet: 172.28.40.0/24
  mgmt_net:
    ipam:
      driver: default
      config:
        - subnet: 172.28.50.0/24

services:
  # Edge Tier
  edge-nginx:
    image: nginx:alpine
    container_name: hrms-staging-edge
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      dmz_net:
        ipv4_address: 172.28.10.11

  # Data Tier - Consensus (etcd)
  etcd-01:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: hrms-staging-etcd-01
    restart: unless-stopped
    environment:
      - ETCD_NAME=etcd-01
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://172.28.30.31:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://172.28.30.31:2380
      - ETCD_INITIAL_CLUSTER=etcd-01=http://172.28.30.31:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=hrms-staging-token
      - ETCD_INITIAL_CLUSTER_STATE=new
    networks:
      data_net:
        ipv4_address: 172.28.30.31

  # Database Load Balancer (HAProxy)
  haproxy-db:
    image: haproxy:alpine
    container_name: hrms-staging-haproxy-db
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
      - "7000:7000"
    networks:
      data_net:
        ipv4_address: 172.28.30.30

  # Connection Pooler (PgBouncer)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: hrms-staging-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      - DB_USER=hrms_app
      - DB_PASSWORD=ChangeMeAppSecretDb99!
      - DB_HOST=172.28.30.30
      - DB_PORT=5000
      - DB_NAME=hrms
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=40
    networks:
      data_net:
        ipv4_address: 172.28.30.34
      app_net:
        ipv4_address: 172.28.20.34

  # Cache Tier (Valkey / Redis)
  valkey-primary:
    image: valkey/valkey:7.2-alpine
    container_name: hrms-staging-valkey-primary
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "ChangeMeValkeyPassword99!", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    networks:
      data_net:
        ipv4_address: 172.28.30.35

  valkey-sentinel:
    image: valkey/valkey:7.2-alpine
    container_name: hrms-staging-valkey-sentinel
    restart: unless-stopped
    ports:
      - "26379:26379"
    networks:
      data_net:
        ipv4_address: 172.28.30.37

  # Object Storage (MinIO)
  minio-storage:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: hrms-staging-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=hrms_s3_admin
      - MINIO_ROOT_PASSWORD=ChangeMeMinioRootSecret99!
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      backup_net:
        ipv4_address: 172.28.40.41

  # Secrets Management (OpenBao)
  openbao-vault:
    image: quay.io/openbao/openbao:2.0.0
    container_name: hrms-staging-openbao
    restart: unless-stopped
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=hrms-staging-root-token
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      mgmt_net:
        ipv4_address: 172.28.50.84
