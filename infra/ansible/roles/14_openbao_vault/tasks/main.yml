---
- name: Create openbao system group
  ansible.builtin.group:
    name: openbao
    system: true
    state: present

- name: Create openbao system user
  ansible.builtin.user:
    name: openbao
    group: openbao
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/openbao
    create_home: false
    state: present

- name: Ensure OpenBao directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: openbao
    group: openbao
    mode: "0750"
  loop:
    - /etc/openbao
    - "{{ bao_data_dir }}"

- name: Deploy OpenBao configuration
  ansible.builtin.template:
    src: bao.hcl.j2
    dest: /etc/openbao/bao.hcl
    owner: openbao
    group: openbao
    mode: "0600"
  notify: Restart openbao

- name: Deploy OpenBao initialization script
  ansible.builtin.template:
    src: init_openbao.sh.j2
    dest: /usr/local/bin/init_openbao.sh
    owner: root
    group: root
    mode: "0700"

- name: Enable and start OpenBao service
  ansible.builtin.systemd:
    name: openbao
    state: started
    enabled: true
