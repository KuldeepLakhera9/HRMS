---
- name: Create hrms system group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true
    state: present

- name: Create hrms system user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /bin/bash
    home: "{{ app_root_dir }}"
    create_home: true
    state: present

- name: Ensure /etc/hrms configuration directory exists
  ansible.builtin.file:
    path: /etc/hrms
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"

- name: Deploy application environment file
  ansible.builtin.template:
    src: hrms-web.env.j2
    dest: /etc/hrms/hrms-web.env
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  notify: Restart hrms-web

- name: Deploy hrms-web systemd unit
  ansible.builtin.template:
    src: hrms-web.service.j2
    dest: /etc/systemd/system/hrms-web.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart hrms-web

- name: Enable and start hrms-web service
  ansible.builtin.systemd:
    name: hrms-web
    state: started
    enabled: true
