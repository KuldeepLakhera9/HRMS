---
- name: Create minio system group
  ansible.builtin.group:
    name: minio-user
    system: true
    state: present

- name: Create minio system user
  ansible.builtin.user:
    name: minio-user
    group: minio-user
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/minio
    create_home: false
    state: present

- name: Ensure MinIO data directory exists
  ansible.builtin.file:
    path: "{{ minio_data_dir }}"
    state: directory
    owner: minio-user
    group: minio-user
    mode: "0750"

- name: Deploy MinIO environment configuration
  ansible.builtin.template:
    src: minio.env.j2
    dest: /etc/default/minio
    owner: minio-user
    group: minio-user
    mode: "0600"
  notify: Restart minio

- name: Deploy bucket initialization script
  ansible.builtin.template:
    src: init_buckets.sh.j2
    dest: /usr/local/bin/init_hrms_buckets.sh
    owner: root
    group: root
    mode: "0750"

- name: Enable and start MinIO service
  ansible.builtin.systemd:
    name: minio
    state: started
    enabled: true
