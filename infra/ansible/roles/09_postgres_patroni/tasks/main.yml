---
- name: Install PostgreSQL 16 and extensions
  ansible.builtin.package:
    name:
      - postgresql-16
      - postgresql-16-postgis-3
      - postgresql-contrib-16
      - python3-psycopg2
      - python3-pip
      - pgbackrest
    state: present

- name: Install Patroni with python-etcd3
  ansible.builtin.pip:
    name:
      - patroni[etcd3]
      - python-etcd
    state: present
    break_system_packages: true

- name: Disable and stop default PostgreSQL systemd service
  ansible.builtin.systemd:
    name: postgresql
    state: stopped
    enabled: false

- name: Create Patroni configuration directory
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Deploy Patroni configuration
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart patroni

- name: Deploy Patroni systemd service unit
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart patroni

- name: Enable and start Patroni service
  ansible.builtin.systemd:
    name: patroni
    state: started
    enabled: true
