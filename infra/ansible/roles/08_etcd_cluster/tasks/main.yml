---
- name: Create etcd system group
  ansible.builtin.group:
    name: etcd
    system: true
    state: present

- name: Create etcd system user
  ansible.builtin.user:
    name: etcd
    group: etcd
    system: true
    shell: /usr/sbin/nologin
    home: "{{ etcd_data_dir }}"
    create_home: false
    state: present

- name: Ensure etcd directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"
  loop:
    - /etc/etcd
    - "{{ etcd_data_dir }}"

- name: Deploy etcd configuration
  ansible.builtin.template:
    src: etcd.yml.j2
    dest: /etc/etcd/etcd.yml
    owner: etcd
    group: etcd
    mode: "0600"
  notify: Restart etcd

- name: Deploy etcd systemd unit
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart etcd

- name: Enable and start etcd service
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: true
