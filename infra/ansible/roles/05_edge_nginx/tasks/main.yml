---
- name: Install Nginx, Keepalived, and dependencies
  ansible.builtin.package:
    name:
      - nginx
      - keepalived
      - curl
    state: present

- name: Ensure Nginx public and web directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: nginx
    group: nginx
    mode: "0755"
  loop:
    - /var/www/hrms/public
    - /var/www/certbot
    - /etc/nginx/conf.d

- name: Deploy maintenance.html
  ansible.builtin.copy:
    src: maintenance.html
    dest: /var/www/hrms/public/maintenance.html
    owner: nginx
    group: nginx
    mode: "0644"

- name: Deploy Coraza WAF ruleset if enabled
  ansible.builtin.copy:
    src: coraza.conf
    dest: /etc/nginx/coraza.conf
    owner: root
    group: root
    mode: "0644"
  when: enable_waf | default(true)
  notify: Reload nginx

- name: Configure main nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    validate: "nginx -t -c %s"
  notify: Reload nginx

- name: Configure HRMS virtual host
  ansible.builtin.template:
    src: hrms.conf.j2
    dest: /etc/nginx/conf.d/hrms.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Deploy keepalived health check script
  ansible.builtin.template:
    src: check_nginx.sh.j2
    dest: /usr/local/bin/check_nginx.sh
    owner: root
    group: root
    mode: "0755"

- name: Configure keepalived
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart keepalived

- name: Enable and start Nginx service
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Enable and start Keepalived service
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true
