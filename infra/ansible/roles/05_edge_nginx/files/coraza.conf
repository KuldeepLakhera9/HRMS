# Coraza / OWASP Core Rule Set configuration for HRMS Edge
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

SecResponseBodyAccess Off

SecTmpDir /tmp/
SecDataDir /tmp/

# Audit Logging
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/coraza_audit.log

# Rule 911100: Restrict HTTP methods
SecRule REQUEST_METHOD "!@within GET HEAD POST PUT PATCH DELETE OPTIONS" \
    "id:10001,phase:1,deny,status:405,log,msg:'Method Not Allowed'"

# Rule 920100: Invalid Host header
SecRule &REQUEST_HEADERS:Host "@eq 0" \
    "id:10002,phase:1,deny,status:400,log,msg:'Missing Host Header'"

# SQL Injection signature detection
SecRule ARGS|REQUEST_BODY "@rx (?i)(union\s+select|select\s+.*\s+from|insert\s+into|drop\s+table|information_schema|exec\s*\(|benchmark\s*\()" \
    "id:10003,phase:2,deny,status:403,log,msg:'SQL Injection Attempt Detected'"

# Path Traversal detection
SecRule REQUEST_URI|ARGS "@rx (?:\.\./|\.\.\\)" \
    "id:10004,phase:1,deny,status:403,log,msg:'Path Traversal Attempt Detected'"
